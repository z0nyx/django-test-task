{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Django Stripe Payments{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'index' %}">Django Stripe Payments</a>
        <nav class="navigation">
            <a href="{% url 'index' %}">Catalog</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
